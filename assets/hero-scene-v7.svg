<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">都城の暮らしサービス利用シーン</title>
<desc id="desc">エアコンを整備する男性スタッフと女性スタッフ、仕上がりを喜ぶ高齢夫婦がいる明るい日本の居間。</desc>
