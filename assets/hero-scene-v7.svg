  <linearGradient id="beige" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8b58d"/><stop offset="1" stop-color="#b98458"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7d0b3"/><stop offset="1" stop-color="#e8ae88"/></linearGradient>
