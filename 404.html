<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#124f3c">
  <meta name="robots" content="noindex,follow">
  <title>ページが見つかりません｜みやこんじょ暮らし</title>
  <link rel="stylesheet" href="/-miyakonojo-kurashi-market/styles.css?v=20260902-senior1">
  <link rel="stylesheet" href="/-miyakonojo-kurashi-market/readability.css">
  <style>
    .errorPage{min-height:100svh;display:grid;place-items:center;padding:110px 20px 48px;background:#eef3f0;color:#171b19}
    .errorCard{width:min(680px,100%);padding:clamp(28px,6vw,54px);border:2px solid #b8c8c0;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(18,79,60,.13);text-align:center}
    .errorCode{display:block;margin-bottom:8px;color:#124f3c;font-size:20px;font-weight:800;letter-spacing:.12em}
    .errorCard h1{margin:0 0 18px;color:#111;font-size:clamp(34px,7vw,52px);line-height:1.3}
    .errorCard p{margin:0 auto;color:#303632;font-size:18px;line-height:1.9}
    .errorActions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
    .errorActions a{display:grid;place-items:center;min-height:56px;padding:12px 16px;border:2px solid #124f3c;border-radius:12px;background:#124f3c;color:#fff;font-size:18px;font-weight:800;text-decoration:none}
    .errorActions a.secondary{background:#fff;color:#124f3c}
    .errorConsult{display:inline-block;margin-top:24px;color:#111;font-size:17px;font-weight:700;text-decoration:underline;text-underline-offset:5px}
    @media(max-width:567px){.errorPage{padding:90px 14px 32px}.errorCard{padding:30px 20px}.errorActions{grid-template-columns:1fr}.errorCard p{font-size:17px}}
  </style>
</head>
<body>
  <header class="siteHeader">
    <a class="brand" href="/-miyakonojo-kurashi-market/" aria-label="みやこんじょ暮らし ホーム">
      <span class="brandMark">み</span>
      <span>みやこんじょ暮らし<small>都城・三股・曽於の生活サービス</small></span>
    </a>
  </header>
  <main class="errorPage">
    <section class="errorCard" aria-labelledby="errorTitle">
      <span class="errorCode">404</span>
      <h1 id="errorTitle">ページが見つかりません</h1>
      <p>URLが変わったか、ページが削除された可能性があります。<br>下のボタンから目的の場所へ戻れます。</p>
      <div class="errorActions">
        <a href="/-miyakonojo-kurashi-market/">トップへ戻る</a>
        <a class="secondary" href="/-miyakonojo-kurashi-market/#search">事業者を探す</a>
      </div>
      <a class="errorConsult" href="/-miyakonojo-kurashi-market/#consult">どこへ頼むか迷ったら運営へ相談</a>
    </section>
  </main>
</body>
</html>
